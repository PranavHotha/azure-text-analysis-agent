<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modern Button Component</title>
  
  <!-- Google Fonts: Noto Sans JP -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css?family=Noto+Sans+JP:400&display=swap" rel="stylesheet" />

  <!-- Component Stylesheet -->
  <link rel="stylesheet" href="../button-styles/modern-button.css" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #fafafa;
      font-family: 'Noto Sans JP', sans-serif;
      font-weight: 400;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      gap: 24px;
    }

    .demo-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      text-align: center;
      max-width: 480px;
      width: 100%;
    }

    .demo-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: #0f172a;
      margin-bottom: 8px;
    }

    .demo-subtitle {
      font-size: 0.875rem;
      color: #64748b;
      margin-bottom: 24px;
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
  </style>
</head>
<body>

  <div class="demo-card">
    <h1 class="demo-title">Modern Button Component</h1>
    <p class="demo-subtitle">Effect 01: Hover Sheen Sweep Animation (Fully Responsive)</p>

    <div class="container button-group">
      <!-- Link variant -->
      <a href="#hover" class="btn effect01 modern-button">
        <span>Hover</span>
      </a>

      <!-- Button element variant -->
      <button type="button" class="btn effect01 modern-button">
        <span>Action</span>
      </button>
    </div>
  </div>

</body>
</html>
